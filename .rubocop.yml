# Base RuboCop config for staff-directory-23
# Hybrid mode: plugins: for modern plugins, require: for legacy (rubocop-rspec < 3)
inherit_from:
  - .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'bin/**/*'
    - 'db/schema.rb'
    - 'node_modules/**/*'
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'log/**/*'

# Modern plugins that support plugin mode
plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-capybara
  - rubocop-factory_bot

# -----------------------
# Rails
# -----------------------
Rails:
  Enabled: true

Rails/Output:
  Enabled: true

Rails/Exit:
  Enabled: true

Rails/FilePath:
  Enabled: true


Rails/HasManyOrHasOneDependent:
  Enabled: true

Rails/ReversibleMigration:
  Exclude:
    - 'db/migrate/**/*'

Rails/SkipsModelValidations:
  Exclude:
    - 'db/migrate/**/*'

Rails/OutputSafety:
  Enabled: true

# -----------------------
# Bundler
# -----------------------
Bundler/OrderedGems:
  Enabled: true

# -----------------------
# Layout/Style
# -----------------------
Layout/LineLength:
  Max: 120

Style/Documentation:
  Enabled: true
  Exclude:
    - 'db/migrate/**/*'

# -----------------------
# RSpec (via rubocop-rspec)
# -----------------------
# Make test suite realistic without massive refactors now
RSpec/MultipleExpectations:
  Max: 3

RSpec/ExampleLength:
  Max: 10

RSpec/NestedGroups:
  Max: 4

RSpec/InstanceVariable:
  Enabled: true

RSpec/EmptyExampleGroup:
  Enabled: true

RSpec/DescribedClass:
  Enabled: true

# -----------------------
# RSpec Rails
# -----------------------
Rails/HttpStatus:
  EnforcedStyle: symbolic

# -----------------------
# Capybara (quiet the crashing cops)
# These are noisy/buggy on some versions; re-enable later if desired
# -----------------------
Capybara/ClickLinkOrButtonStyle:
  Enabled: true